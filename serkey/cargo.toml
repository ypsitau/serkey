[package]
name = "serkey"
version = "0.1.4"
edition = "2021"
authors = ["Yutaka Saito <ypsitau@gmail.com>"]
license = "MIT OR Apache-2.0"
description = "A simple keycode parser for handling UTF-8 and VT100 terminal ctrl sequences"
repository = "https://github.com/ypsitau/serkey"
readme = { workspace = true }

[dependencies]
defmt = { workspace = true, optional = true }
heapless = { workspace = true }
embedded-io = { workspace = true }
embedded-io-async = { workspace = true }
embedded-keycode = { workspace = true }

[features]
default = []
defmt = ["dep:defmt"]
