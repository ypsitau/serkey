[package]
name = "serkey"
version = "0.1.0"
edition = "2021"
authors = ["Yutaka Saito <ypsitau@gmail.com>"]
license = "MIT OR Apache-2.0"
description = "A simple keycode parser for handling UTF-8 and VT100 terminal ctrl sequences"
repository = "https://github.com/ypsitau/serkey"
readme = { workspace = true }

[dependencies]
defmt = { version = "1.2.0", optional = true }
heapless = { version = "0.9.3" }
embedded-io = { version = "0.7.1" }
embedded-io-async = { version = "0.7.0" }
embedded-keycode = { version = "0.1.2" }
#embedded-keycode = { git = "https://github.com/ypsitau/embedded-keycode" }

[features]
default = []
defmt = ["dep:defmt"]
