[workspace]
resolver = "2"
members = [
    "serkey",
    "main-async",
    "main-blocking",
]
exclude = ["examples"]

[workspace.dependencies]
serkey = { path = "serkey" }
defmt = { version = "1.2.0" }
heapless = { version = "0.9.3" }
embedded-io = { version = "0.7.1" }
embedded-io-async = { version = "0.7.0" }
embedded-keycode = { version = "0.1.3" }
